name: CI
# Nx Cloud CI now runs CI for this repository, so this workflow no longer runs on its own.
# To run it again on every change, restore the triggers below and remove `on: workflow_dispatch`.
# on:
#   push:
#     branches:
#       - main
#   pull_request:
on: workflow_dispatch
env:
  node_version: 20

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/workflows/setup
        with:
          node_version: ${{ env.node_version }}
      - run: yarn nx run-many --target=build,test,lint  --exclude monodon --parallel --max-parallel=3
      - run: yarn nx run-many --target=e2e --exclude monodon --parallel
      - run: yarn nx-cloud stop-all-agents
