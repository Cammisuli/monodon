# yaml-language-server: $schema=https://cloud.nx.app/nx-cloud/static/schemas/workflow.schema.json
triggers:
  pull-requests:
    event: PR
    branches: ['main']
  pushes:
    event: PUSH
    branches: ['main']

workflows:
  main:
    runs-on: linux-large-js
    # Tasks run on this one machine, which fits most workspaces.
    # For a large workspace, uncomment workers to add 3 more machines like this one.
    # They start with every run: large runs can finish sooner, and runs usually use more credits.
    # https://nx.dev/docs/reference/nx-cloud/ci-config#jobsjobworkers
    # workers: 3
    steps:
      - name: Run affected tasks
        script: |
          yarn nx affected -t lint test build
